<div class="flex min-h-screen bg-[var(--el-bg-soft)]">
  <aside class="sticky top-0 self-start flex flex-col w-[260px] min-w-[260px] h-screen bg-[#182442]">
    <div class="flex items-center gap-3 px-6 pt-6 pb-5">
      <span class="text-amber-300 text-[28px]"><el-icon name="bolt" size="1.75rem" /></span>
      <span class="font-bold text-xl text-white tracking-tight">ElectroLink</span>
    </div>

    <nav class="flex-1 flex flex-col gap-1 p-3">
      @for (item of menu; track item.path) {
        <button
          type="button"
          class="flex items-center gap-3 w-full px-4 py-3 text-left rounded-lg text-sm font-medium border-l-[3px] transition"
          [class]="isActive(item.path)
            ? 'bg-[#2e3a59] text-white border-blue-500'
            : 'bg-transparent text-white/55 border-transparent hover:bg-[#2e3a59]/60 hover:text-white/90'"
          (click)="navigate(item.path)"
        >
          <el-icon [name]="item.icon" size="1.125rem" />
          <span>{{ item.label }}</span>
        </button>
      }
    </nav>

    <div class="flex flex-col gap-2 p-3 border-t border-white/10">
      <button
        type="button"
        class="flex items-center justify-center gap-2 w-full px-4 py-2.5 text-sm font-medium text-white/75 bg-white/5 border border-white/10 rounded-lg hover:bg-white/10 transition"
      >
        <el-icon name="headphones" size="1rem" />
        <span>Get Support</span>
      </button>

      <div class="flex items-center gap-2.5 px-3 py-2">
        <span class="text-white/50 shrink-0"><el-icon name="user" size="1.25rem" /></span>
        <div class="flex-1 min-w-0">
          <span class="block text-[13px] font-semibold text-white truncate">{{ store.currentUser()?.username }}</span>
          <span class="block text-[11px] text-white/35">Technician</span>
        </div>
        <button
          type="button"
          class="text-white/35 hover:text-rose-500 transition p-1 shrink-0"
          title="Cerrar Sesión"
          (click)="logout()"
        >
          <el-icon name="sign-out" size="1.125rem" />
        </button>
      </div>
    </div>
  </aside>

  <main class="flex-1 min-h-screen overflow-y-auto"><router-outlet /></main>
</div>
